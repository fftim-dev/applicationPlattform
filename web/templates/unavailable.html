<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service is unavailable</title>
</head>
<body>
  <h1>Service is unavailable, try again later.</h1>
  <!--Block für flash Nachrichten-->
  {% with exceptions = get_flashed_messages(with_categories=false) %}
    {% if exceptions %}
      <ul>
        {% for exception in exceptions %}
          <li>{{ exception }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</body>
</html>
